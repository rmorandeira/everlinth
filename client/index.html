<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVERLINTH</title>
  </head>
  <body>
    <div id="login">
      <form id="login-form">
        <h1>EVERLINTH</h1>
        <input id="username" type="text" placeholder="Tu nombre" maxlength="20" autocomplete="off" required />
        <button type="submit">Entrar</button>
        <p id="login-error"></p>
      </form>
      <div id="gamepad-keyboard" class="hidden"></div>
      <p id="gamepad-hint" class="hidden"></p>
    </div>

    <div id="game" class="hidden">
      <canvas id="scene"></canvas>
      <canvas id="weather"></canvas>
      <div id="hud">
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <div id="stats"></div>
      </div>
      <div id="discovery" class="hidden"></div>
      <div id="screen-code"></div>
      <canvas id="minimap"></canvas>
      <label id="zombie-toggle" title="Activar o desactivar los zombis (tecla Z)">
        <input type="checkbox" id="zombie-toggle-input" checked />
        <span class="switch"></span>
        <span class="text">Zombis</span>
      </label>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
